  <style>
    :root { color-scheme: dark; --bg:#0b1020; --panel:#151d33; --text:#f4f6fb; --muted:#b8c1d8; --accent:#8db7ff; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
      color:var(--text); background:radial-gradient(circle at top,#1c3158 0,#0b1020 55%); }
    main { width:min(100%,680px); padding:clamp(28px,6vw,52px); border:1px solid #2a3858;
      border-radius:28px; background:rgba(21,29,51,.92); box-shadow:0 24px 70px #0007; text-align:center; }
    .avatar { width:88px; height:88px; margin:0 auto 20px; display:grid; place-items:center;
      border-radius:50%; background:linear-gradient(135deg,#8db7ff,#b9a2ff); color:#10182b;
      font-size:2rem; font-weight:800; }
    h1 { margin:0; font-size:clamp(2rem,6vw,3rem); letter-spacing:-.04em; }
    .tag { margin:12px 0 0; color:var(--accent); font-weight:650; }
    .bio { max-width:480px; margin:18px auto 28px; color:var(--muted); line-height:1.7; }
    .links { display:grid; gap:12px; max-width:390px; margin:0 auto; }
    a { display:block; padding:15px 20px; border-radius:14px; text-decoration:none; color:#10182b;
      background:#dce8ff; font-weight:750; transition:transform .15s ease, opacity .15s ease; }
    a:hover { transform:translateY(-2px); opacity:.92; }
    .note { margin:28px 0 0; color:#8794b1; font-size:.85rem; }
  </style>
</head>
<body>

    <nav class="links" aria-label="Social profiles">
      <a href="https://youtube.com/channel/UCKyYuIIVb1okNOCJsQ-XHRw" target="_blank" rel="noopener noreferrer">▶ Visit my YouTube channel</a>
      <a href="https://www.instagram.com/_capital_letter_01/" target="_blank" rel="noopener noreferrer">◎ Follow me on Instagram</a>

</body>
